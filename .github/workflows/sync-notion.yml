name: Sync content from Notion

on:
  schedule:
    - cron: "0 * * * *" # 每小時
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run sync script
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_TRIPS_DB_ID: ${{ secrets.NOTION_TRIPS_DB_ID }}
          NOTION_ITINERARY_DB_ID: ${{ secrets.NOTION_ITINERARY_DB_ID }}
          NOTION_FLIGHTS_DB_ID: ${{ secrets.NOTION_FLIGHTS_DB_ID }}
          NOTION_HOTELS_DB_ID: ${{ secrets.NOTION_HOTELS_DB_ID }}
          NOTION_TRANSPORT_DB_ID: ${{ secrets.NOTION_TRANSPORT_DB_ID }}
          NOTION_GUIDE_DB_ID: ${{ secrets.NOTION_GUIDE_DB_ID }}
          NOTION_PHRASES_DB_ID: ${{ secrets.NOTION_PHRASES_DB_ID }}
        run: npm run sync:notion
      - name: Commit changes
        run: |
          git config user.name "notion-sync[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "chore: sync content from Notion"
          git push
